<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Roulette des Gages</title>
<style>
  :root {
    --bg: #0e0f13;
    --bg-soft: #16181f;
    --card: #1c1f28;
    --border: #2a2e3a;
    --accent: #6c5ce7;
    --accent-hover: #8177f0;
    --danger: #ff5c72;
    --text: #eef0f5;
    --text-dim: #8b90a1;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #1a1d27, #0b0c10 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .screen { width: 100%; max-width: 480px; }
  .hidden { display: none !important; }

  /* ---- Ecran d'accueil (création / jointure de salon) ---- */
  .logo { text-align: center; margin-bottom: 28px; }
  .logo h1 { font-size: 1.9rem; margin: 0; letter-spacing: -0.5px; }
  .logo p { color: var(--text-dim); margin: 6px 0 0; font-size: 0.9rem; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 16px;
  }
  .card h2 { margin: 0 0 14px; font-size: 1.05rem; color: var(--text-dim); font-weight: 600; }

  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--text);
    font-size: 1rem;
    margin-bottom: 10px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: var(--text-dim); }

  button {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover { background: var(--accent-hover); }
  button:active { transform: scale(0.98); }
  button.secondary { background: var(--bg-soft); border: 1px solid var(--border); color: var(--text); }
  button.danger { background: var(--danger); }

  .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: -4px; margin-bottom: 8px; min-height: 1em; }

  /* ---- Ecran de jeu ---- */
  #game-screen.screen { max-width: 900px; width: 100%; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
  }
  .room-code-pill {
    background: var(--bg-soft); border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 999px; font-weight: 700; letter-spacing: 2px;
  }
  #start-round-btn { width: auto; padding: 10px 20px; }

  .video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }
  .tile {
    position: relative;
    background: #000;
    border-radius: var(--radius);
    overflow: hidden;
    aspect-ratio: 4 / 3;
    border: 2px solid var(--border);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .tile video { width: 100%; height: 100%; object-fit: cover; display: block; transform: scaleX(-1); }
  .tile .placeholder {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    font-size: 2rem; font-weight: 700; color: var(--text-dim); background: var(--bg-soft);
  }
  .tile .pseudo-tag {
    position: absolute; bottom: 6px; left: 6px;
    background: rgba(0,0,0,0.55); padding: 3px 9px; border-radius: 999px; font-size: 0.78rem;
  }
  .tile.selected { border-color: var(--danger); box-shadow: 0 0 22px rgba(255,92,114,0.55); }
  .tile.host-tile::after {
    content: "★"; position: absolute; top: 6px; right: 8px; color: #ffd166; font-size: 0.9rem;
  }
  .tile.cheat-clickable { cursor: crosshair; }
  .tile.cheat-clickable:hover { border-color: var(--accent); }

  .footer-hint { text-align: center; color: var(--text-dim); font-size: 0.8rem; margin-top: 18px; }

  /* Petit indicateur discret du mode secret (volontairement minimaliste) */
  #cheat-indicator {
    position: fixed; bottom: 10px; right: 10px;
    width: 8px; height: 8px; border-radius: 50%;
    background: transparent; transition: background 0.4s;
  }
  #cheat-indicator.active { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
</style>
</head>
<body>

  <!-- ================= ECRAN D'ACCUEIL ================= -->
  <div id="home-screen" class="screen">
    <div class="logo">
      <h1>🎭 Roulette des Gages</h1>
      <p>Le hasard choisit. Ton sérieux fait le reste.</p>
    </div>

    <div class="card">
      <h2>Créer un salon</h2>
      <input type="text" id="create-pseudo" placeholder="Ton pseudo" maxlength="16" />
      <button id="create-room-btn">Créer la partie</button>
    </div>

    <div class="card">
      <h2>Rejoindre un salon</h2>
      <input type="text" id="join-code" placeholder="Code du salon (ex: AB12)" maxlength="4" style="text-transform:uppercase" />
      <input type="text" id="join-pseudo" placeholder="Ton pseudo" maxlength="16" />
      <div class="error-msg" id="join-error"></div>
      <button id="join-room-btn" class="secondary">Rejoindre</button>
    </div>
  </div>

  <!-- ================= ECRAN DE JEU ================= -->
  <div id="game-screen" class="screen hidden">
    <div class="topbar">
      <div class="room-code-pill">Salon : <span id="room-code-display"></span></div>
      <button id="start-round-btn" class="hidden">🎲 Lancer un tour</button>
    </div>

    <div class="video-grid" id="video-grid"></div>

    <p class="footer-hint">Garde ton sérieux face caméra. Bonne chance 😏</p>
  </div>

  <div id="cheat-indicator"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
